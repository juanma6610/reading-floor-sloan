[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers

markers =
    slow: touches the real 98k-shot dataset (deselect with -m "not slow")
    known_failure: asserts behaviour the code does NOT have yet — see the triage list

filterwarnings =
    ignore::DeprecationWarning:xgboost.*
